server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      # Une route = un préfixe de chemin -> un service. La passerelle ne contient AUCUNE règle métier : elle route seulement,
      # et retransmet l'en-tête Authorization tel quel (les services décident des droits).
      routes:
        # Descriptions d'API des services, pour la page Swagger de la passerelle : /docs/<service>/v3/api-docs -> /v3/api-docs du service.
        # L'en-tête Host d'origine est conservé pour que les essais lancés depuis Swagger passent par la passerelle.
        - id: docs-auth
          uri: ${AUTH_URL:http://localhost:8084}
          predicates:
            - Path=/docs/auth/v3/api-docs/**
          filters:
            - PreserveHostHeader
            - RewritePath=/docs/auth/(?<reste>.*), /$\{reste}
        - id: docs-customer
          uri: ${CUSTOMER_URL:http://localhost:8081}
          predicates:
            - Path=/docs/customer/v3/api-docs/**
          filters:
            - PreserveHostHeader
            - RewritePath=/docs/customer/(?<reste>.*), /$\{reste}
        - id: docs-quotation
          uri: ${QUOTATION_URL:http://localhost:8082}
          predicates:
            - Path=/docs/quotation/v3/api-docs/**
          filters:
            - PreserveHostHeader
            - RewritePath=/docs/quotation/(?<reste>.*), /$\{reste}
        - id: docs-campaign
          uri: ${CAMPAIGN_URL:http://localhost:8083}
          predicates:
            - Path=/docs/campaign/v3/api-docs/**
          filters:
            - PreserveHostHeader
            - RewritePath=/docs/campaign/(?<reste>.*), /$\{reste}
        - id: customer
          uri: ${CUSTOMER_URL:http://localhost:8081}
          predicates:
            - Path=/clients/**,/categories/**,/contacts/**,/interactions/**
        - id: quotation
          uri: ${QUOTATION_URL:http://localhost:8082}
          predicates:
            - Path=/devis/**,/produits/**,/taxes/**,/public/reponse/**
        - id: campaign
          uri: ${CAMPAIGN_URL:http://localhost:8083}
          predicates:
            - Path=/campagnes/**,/canaux/**,/contenus/**,/publics/**,/public/campagnes/**,/public/invitations/**
        - id: auth
          uri: ${AUTH_URL:http://localhost:8084}
          predicates:
            - Path=/login
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"      # développement : à restreindre à l'adresse de l'interface en production
            allowedMethods: "*"
            allowedHeaders: "*"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls-primary-name: Connexion (Auth) - commencer ici   # la page s'ouvre sur le login (sinon : ordre alphabétique, Campagnes en premier)
    urls:                           # un menu déroulant : une description d'API par service
      - { name: Connexion (Auth) - commencer ici, url: /docs/auth/v3/api-docs }
      - { name: Clients (Customer), url: /docs/customer/v3/api-docs }
      - { name: Devis (Quotation), url: /docs/quotation/v3/api-docs }
      - { name: Campagnes (Campaign), url: /docs/campaign/v3/api-docs }

app:
  security:
    # none (défaut) : la passerelle ne vérifie rien ; jwt : elle refuse (401) toute requête sans jeton valide avant de la transmettre.
    # Dans les deux cas, ce sont les SERVICES qui contrôlent le rôle de chaque route.
    mode: ${SECURITY_MODE:none}
    # Le MÊME secret que celui des services et du service de login. Jamais de vrai secret dans git.
    jwt-secret: ${JWT_SECRET:secret-de-developpement-secret-de-developpement-0123}

management:
  endpoints:
    web:
      exposure:
        include: health,info

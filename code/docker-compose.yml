# Module commercial : trois bases MySQL, RabbitMQ et les trois services Java.
#   docker compose up -d                 -> seulement l'infrastructure (bases + RabbitMQ), les services tournent sur le poste
#   docker compose --profile services up -d --build   -> tout, services compris
# Identifiants de développement uniquement (données fictives).
services:
  customer-db:
    image: mysql:8.0
    container_name: customer-db
    environment:
      MYSQL_ROOT_PASSWORD: soa
      MYSQL_DATABASE: customer_db
    ports: ["3307:3306"]
    volumes: [customer-data:/var/lib/mysql]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psoa"], interval: 5s, retries: 20 }

  quotation-db:
    image: mysql:8.0
    container_name: quotation-db
    environment:
      MYSQL_ROOT_PASSWORD: soa
      MYSQL_DATABASE: quotation_db
    ports: ["3308:3306"]
    volumes: [quotation-data:/var/lib/mysql]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psoa"], interval: 5s, retries: 20 }

  campaign-db:
    image: mysql:8.0
    container_name: campaign-db
    environment:
      MYSQL_ROOT_PASSWORD: soa
      MYSQL_DATABASE: campaign_db
    ports: ["3309:3306"]
    volumes: [campaign-data:/var/lib/mysql]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psoa"], interval: 5s, retries: 20 }

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports: ["5672:5672", "15672:15672"]   # 15672 : console web (guest / guest)
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, retries: 10 }

  customer-service:
    build: ./customer-service
    container_name: customer-service
    profiles: ["services"]
    restart: on-failure   # sur un volume neuf, MySQL se déclare prêt trop tôt (serveur temporaire d'initialisation) : le service se relance seul
    depends_on:
      customer-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      DB_URL: "jdbc:mysql://customer-db:3306/customer_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USER: root
      DB_PASSWORD: soa
      RABBIT_HOST: rabbitmq
      # none (défaut) : aucune authentification ; jwt : chaque route d'employé exige un JWT (voir code/README.md)
      SECURITY_MODE: ${SECURITY_MODE:-none}
      JWT_SECRET: ${JWT_SECRET:-secret-de-developpement-secret-de-developpement-0123}
    ports: ["8081:8081"]

  quotation-service:
    build: ./quotation-service
    container_name: quotation-service
    profiles: ["services"]
    restart: on-failure
    depends_on:
      quotation-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      DB_URL: "jdbc:mysql://quotation-db:3306/quotation_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USER: root
      DB_PASSWORD: soa
      RABBIT_HOST: rabbitmq
      # none (défaut) : aucune authentification ; jwt : chaque route d'employé exige un JWT (voir code/README.md)
      SECURITY_MODE: ${SECURITY_MODE:-none}
      JWT_SECRET: ${JWT_SECRET:-secret-de-developpement-secret-de-developpement-0123}
      CUSTOMER_URL: http://customer-service:8081
    ports: ["8082:8082"]

  campaign-service:
    build: ./campaign-service
    container_name: campaign-service
    profiles: ["services"]
    restart: on-failure
    depends_on:
      campaign-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      DB_URL: "jdbc:mysql://campaign-db:3306/campaign_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USER: root
      DB_PASSWORD: soa
      RABBIT_HOST: rabbitmq
      # none (défaut) : aucune authentification ; jwt : chaque route d'employé exige un JWT (voir code/README.md)
      SECURITY_MODE: ${SECURITY_MODE:-none}
      JWT_SECRET: ${JWT_SECRET:-secret-de-developpement-secret-de-developpement-0123}
      CUSTOMER_URL: http://customer-service:8081
    ports: ["8083:8083"]

  # Service de login PROVISOIRE (utilisateurs fictifs, émission de JWT) : à remplacer par le service Authentication de l'autre trinôme
  auth-service:
    build: ./auth-service
    container_name: auth-service
    profiles: ["services"]
    environment:
      JWT_SECRET: ${JWT_SECRET:-secret-de-developpement-secret-de-developpement-0123}
    ports: ["8084:8084"]

  # Passerelle (API Gateway) : UN SEUL point d'entrée, http://localhost:8080 ; elle route vers les quatre services par préfixe de chemin
  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    profiles: ["services"]
    depends_on:
      - customer-service
      - quotation-service
      - campaign-service
      - auth-service
    environment:
      CUSTOMER_URL: http://customer-service:8081
      QUOTATION_URL: http://quotation-service:8082
      CAMPAIGN_URL: http://campaign-service:8083
      AUTH_URL: http://auth-service:8084
      SECURITY_MODE: ${SECURITY_MODE:-none}
      JWT_SECRET: ${JWT_SECRET:-secret-de-developpement-secret-de-developpement-0123}
    ports: ["8080:8080"]

volumes:
  customer-data:
  quotation-data:
  campaign-data:
